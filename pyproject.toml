[project]
name = "base-service"
version = "0.2.0"
description = "Base service component used as the foundation for building microservices."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.117.0",
    "pydantic>=2.13.5",
    "uvicorn>=0.37.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["base_service"]
default_section = "THIRDPARTY"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/base_service --cov-report=html"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

